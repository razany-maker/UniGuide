<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - UniGuide</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="forgot-page">
  <main class="forgot-container">
    <div class="forgot-card">

      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#263C74" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>Reset Password</h1>
      <p>Enter your university email address and we'll send you instructions to reset your password.</p>

      <form>
        <div class="form-group">
          <label for="resetEmail">University Email</label>

          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#8A96A8" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>

            <input type="email" id="resetEmail" placeholder="student@cit.just.edu.jo" required />
          </div>
        </div>

        <button type="submit" class="reset-btn">Send Reset Link</button>
      </form>

      <a href="index.html" class="back-link">← Back to login</a>

    </div>
  </main>
</body>
</html>
