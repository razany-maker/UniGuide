<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UniGuide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-blob blob-1" style="background-color: var(--accent); right: 20%; left: auto;"></div>
    <div class="bg-blob blob-2" style="background-color: var(--primary); left: 20%; right: auto;"></div>

    <div class="auth-container">
        <div style="width: 100%; max-width: 450px;">
            <a href="index.html"
                style="display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 800; font-size: 14px;">
                ← Back to Login
            </a>

            <div class="glass-panel auth-card">
                <div class="auth-card-accent-line"
                    style="background: linear-gradient(90deg, var(--accent), var(--primary));"></div>

                <div class="auth-header">
                    <div class="auth-icon" style="background: linear-gradient(135deg, var(--accent), #9B231D);">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <h1>Reset Password</h1>
                    <p>Enter your JUST email address to receive reset instructions.</p>
                </div>

                <form id="forgotForm">
                    <div class="form-group">
                        <label for="resetEmail">University Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#263C74" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                            <input type="email" id="resetEmail" placeholder="student@just.edu.jo" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="background-color: var(--accent);">Send Reset
                        Link</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
