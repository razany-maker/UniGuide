<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniGuide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative Glowing Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Glassmorphic Container -->
    <div class="glass-card">
        <div class="card-accent-line"></div>
        
        <div class="header-container">
            <div class="icon-container">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>UniGuide</h1>
            <p class="subtitle">Welcome back to JUST Academic Advising</p>
        </div>

        <!-- Note the action goes directly to courses.html! -->
        <form action="courses.html" method="get">
            
            <div class="input-group">
                <div class="input-label-container">
                    <label class="input-label" for="email">University Email</label>
                </div>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="email" class="input-field" placeholder="student@just.edu.jo" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-label-container">
                    <label class="input-label" for="password">Password</label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" class="input-field password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Sign In 
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            </button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="#">Contact Registration</a>
        </div>
    </div>
</body>
</html>
