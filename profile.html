<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - UniGuide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <aside class="sidebar glass-panel">
        <div class="sidebar-brand">
            <div class="sidebar-icon">UG</div>
            <h2>UniGuide</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="courses.html" class="nav-item">Course Map</a>
            <a href="profile.html" class="nav-item active">Student Profile</a>
            <a href="chatbot.html" class="nav-item">UniGuide Chat</a>
        </nav>
        <a href="index.html" class="logout-btn">Logout</a>
    </aside>

    <main class="main-content">
        <div class="profile-header glass-panel">
            <div class="profile-avatar">BA</div>
            <div class="profile-info">
                <h1>Bushra Al momani</h1>
                <p>Computer Science • Senior Year</p>
            </div>
            <div class="gpa-badge">
                <span style="font-size: 10px; text-transform: uppercase;">Cumulative GPA</span><br>
                <strong>3.8 / 4.2</strong>
            </div>
        </div>

        <div class="profile-grid">
            <div class="glass-panel stat-card">
                <h3>Degree Progress</h3>
                <p class="credits-text">120 / 132 Credits Completed</p>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 90%;"></div>
                </div>
            </div>

            <div class="glass-panel stat-card">
                <h3>Current Semester</h3>
                <ul class="current-courses">
                    <li><span class="tag">CS491</span> Graduation Project 1</li>
                    <li><span class="tag">CS420</span> Computer Architecture</li>
                    <li><span class="tag">CS450</span> Distributed Systems</li>
                </ul>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
